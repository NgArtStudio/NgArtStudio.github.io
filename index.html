<!DOCTYPE html>
<html lang="es" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Ng3D</title>
    <link rel="icon" href="iconong3d.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#060a0c', 
                        panelbg: '#09201f', 
                        accent: '#a9d9e5', 
                        whitepure: '#ffffff'
                    }
                }
            }
        }
    </script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        @font-face {
            font-family: 'FreddyFont';
            src: url('FiveFontsatFreddy\'s-Regular.ttf') format('truetype');
        }
        body { font-family: 'FreddyFont', sans-serif; background-color: #060a0c; letter-spacing: 0.05em; font-size: 7px; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #060a0c; border-radius: 9999px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #a9d9e5; border-radius: 9999px; }
        model-viewer { width: 100%; height: 100%; background-color: transparent; --poster-color: transparent; }
        .smooth-transition { transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .carousel-fade { animation: carouselFade 0.6s ease-in-out; }
        @keyframes carouselFade { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes pulse-fade { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .pulse-fade-anim { animation: pulse-fade 1.5s infinite ease-in-out; }
    </style>
</head>
<body class="h-full overflow-hidden text-whitepure relative text-[7px]">

    <!-- Fondo estático -->
<div class="fixed inset-0 w-full h-full z-[-1] flex items-center justify-center pointer-events-none">
    <div 
        class="w-[600px] h-[600px] opacity-80"
        style="
            background-color: #070e0f;
            -webkit-mask: url('iconong3d2.svg') no-repeat center / contain;
            mask: url('iconong3d.svg') no-repeat center / contain;
        "
    >
    </div>
</div>

    <div id="preview-stage" class="absolute inset-0 w-full h-full z-0">
        <model-viewer id="viewer" 
            src="" 
            alt="Modelo 3D interactivo" 
            camera-controls 
            auto-rotate 
            shadow-intensity="1.5" 
            shadow-softness="0.6" 
            exposure="1" 
            interaction-prompt="none" 
            camera-orbit="0deg 75deg 105%"
            min-camera-orbit="auto auto 5%"
            max-camera-orbit="auto auto 300%"
            autoplay-animations>
            
            <div slot="progress-bar" class="absolute inset-0 bg-darkbg flex flex-col items-center justify-center z-30 transition-opacity duration-500" id="loader-overlay">
                <div class="text-center">
                    <div class="w-32 h-32 mx-auto mb-4 flex items-center justify-center">
                        <img src="cargandong.gif" alt="Cargando..." class="w-full h-full object-contain pulse-fade-anim">
                    </div>
                    <p class="text-[20px] text-accent font-extrabold tracking-wider uppercase">Cargando Modelo...</p>
                </div>
            </div>
        </model-viewer>
    </div>

    <header class="absolute top-0 left-0 right-0 z-10 flex flex-col items-center pointer-events-none">
        <div class="w-full max-w-4xl bg-gradient-to-b from-[#11302f] to-[#09201f] rounded-b-[3.5rem] px-8 pt-4 pb-6 flex flex-col items-center gap-4 pointer-events-auto shadow-2xl">
            <button onclick="toggleCatalog(true)" class="group flex flex-col items-center justify-center smooth-transition active:scale-95" title="Ver Catálogo">
                <div class="grid grid-cols-2 gap-1 p-1 rounded-lg hover:bg-accent/10 smooth-transition">
                    <div class="w-4 h-4 rounded-md border-2 border-whitepure group-hover:border-accent smooth-transition"></div>
                    <div class="w-4 h-4 rounded-md border-2 border-whitepure group-hover:border-accent smooth-transition"></div>
                    <div class="w-4 h-4 rounded-md border-2 border-whitepure group-hover:border-accent smooth-transition"></div>
                    <div class="w-4 h-4 rounded-md border-2 border-whitepure group-hover:border-accent smooth-transition"></div>
                </div>
            </button>
        </div>

        <div class="flex items-center justify-center gap-6 mt-4 pointer-events-auto">
            <button onclick="navigateCarousel(-1)" class="w-14 h-14 rounded-2xl bg-gradient-to-b from-[#11302f] to-[#09201f] hover:border-accent border-2 border-transparent flex items-center justify-center overflow-hidden smooth-transition shrink-0 relative group">
                <svg class="w-8 h-8 text-whitepure group-hover:text-accent smooth-transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div id="main-viewer-container" class="w-24 h-24 rounded-3xl bg-darkbg border-[4px] border-whitepure flex items-center justify-center overflow-hidden shadow-lg relative shrink-0 smooth-transition">
                <model-viewer id="viewer-curr" class="w-full h-full pointer-events-none" auto-rotate interaction-prompt="none" disable-zoom disable-pan></model-viewer>
            </div>
            <button onclick="navigateCarousel(1)" class="w-14 h-14 rounded-2xl bg-gradient-to-b from-[#11302f] to-[#09201f] hover:border-accent border-2 border-transparent flex items-center justify-center overflow-hidden smooth-transition shrink-0 relative group">
                <svg class="w-8 h-8 text-whitepure group-hover:text-accent smooth-transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"/></svg>
            </button>
        </div>
    </header>

    <footer class="absolute bottom-6 left-6 right-6 z-10 grid grid-cols-3 items-end pointer-events-none">
        <div class="pointer-events-auto flex justify-start">
            <div class="relative w-16 h-16 sm:w-20 sm:h-20 flex items-center justify-center smooth-transition hover:scale-110">
                <img src="iconong.svg" alt="Logo" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/100x100/09201f/a9d9e5?text=NG';">
            </div>
        </div>

        <div class="w-full max-w-xl mx-4 pointer-events-auto flex flex-col items-center gap-3">
            <div id="animation-controls-container" class="flex flex-col items-center gap-1 select-none smooth-transition opacity-50 pointer-events-none">
                <button id="btn-toggle-play" onclick="togglePlayAnimation()" class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-panelbg text-whitepure smooth-transition">
                    <span id="play-pause-icon" class="text-lg font-black tracking-widest text-whitepure">||</span>
                </button>
                <div class="flex items-center justify-center gap-4">
                    <button onclick="navigateAnimation(-1)" class="p-1 hover:scale-125 active:scale-90 smooth-transition"><svg class="w-4 h-4 text-whitepure fill-current" viewBox="0 0 24 24"><polygon points="18,4 6,12 18,20"/></svg></button>
                    <span id="current-animation-name" class="text-lg font-bold uppercase tracking-widest text-whitepure">"ESTÁTICO"</span>
                    <button onclick="navigateAnimation(1)" class="p-1 hover:scale-125 active:scale-90 smooth-transition"><svg class="w-4 h-4 text-whitepure fill-current" viewBox="0 0 24 24"><polygon points="6,4 18,12 6,20"/></svg></button>
                </div>
            </div>

            <div class="w-full border-[6px] md:border-[8px] border-panelbg bg-transparent rounded-[2.5rem] p-5 text-center flex flex-col items-center justify-center gap-2 smooth-transition">
                <span id="active-category-label" class="text-sm font-black tracking-widest text-darkbg bg-accent px-5 py-1 rounded-full uppercase">"tipo"</span>
                <p id="active-description-text" class="text-whitepure font-bold text-xl sm:text-2xl tracking-wide leading-relaxed max-w-sm">"Descripción Del modelo"</p>
            </div>
            
            <p class="text-[6px] text-whitepure/40 font-bold uppercase tracking-widest mt-[-0.5rem]">NgArtStudio©</p>
        </div>

        <div class="pointer-events-auto flex justify-end">
            <a href="https://linktr.ee/NgArtStudio?utm_source=ig&utm_medium=social&utm_content=link_in_bio&fbclid=PAZXh0bgNhZW0CMTEAc3J0YwZhcHBfaWQPOTM2NjE5NzQzMzkyNDU5AAGnV4mzcu8P_XDdrBtgGGk0hkyLR4ssJVvBcr8YJSyJLt8Hv6P3fMCS5qmKuLM_aem_DIDWflWZFxw84mcZ9biTSA" target="_blank" class="bg-whitepure hover:bg-accent text-darkbg font-black text-lg sm:text-xl tracking-widest uppercase px-6 py-3 rounded-full shadow-lg smooth-transition inline-block hover:scale-105 active:scale-95">CONTACTO</a>
        </div>
    </footer>

    <div id="catalog-overlay" class="hidden fixed inset-0 bg-darkbg/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 z-0 flex items-center justify-center pointer-events-none opacity-20">
            <img src="iconong3d.svg" alt="Fondo" class="w-[400px] h-[400px] object-contain" onerror="this.style.display='none';">
        </div>

        <div class="fade-in w-full max-w-4xl h-[90vh] bg-gradient-to-b from-[#11302f] to-[#09201f] rounded-[3rem] p-8 flex flex-col relative shadow-2xl overflow-hidden border-[6px] border-darkbg z-10">
            
            <div class="flex flex-col items-center gap-4 mb-6 shrink-0">
                <div class="flex flex-col items-center gap-1">
                    <svg class="w-10 h-10 text-accent mb-1" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <h2 class="text-accent text-xl font-black uppercase tracking-widest">Explorar Catálogo</h2>
                </div>
                
                <div class="w-full max-w-lg flex items-center gap-2 bg-darkbg rounded-full px-6 py-3 shadow-inner">
                    <input type="text" id="catalog-search" oninput="filterCatalog()" placeholder="Buscar..." class="bg-transparent text-whitepure text-lg w-full focus:outline-none placeholder-whitepure/30 font-semibold uppercase tracking-widest">
                    <select id="catalog-category-filter" onchange="filterCatalog()" class="bg-panelbg text-accent text-sm font-black rounded-full px-4 py-2 border-none cursor-pointer uppercase tracking-wider smooth-transition hover:bg-accent hover:text-darkbg">
                        <option value="all">Todo</option>
                        <option value="entidad">Entidad</option>
                        <option value="personaje">Personaje</option>
                        <option value="item">Ítem</option>
                        <option value="bloque">Bloque</option>
                        <option value="skins">Skins</option>
                    </select>
                </div>
            </div>

            <button onclick="toggleCatalog(false)" class="absolute top-6 right-6 w-12 h-12 rounded-full bg-darkbg hover:bg-accent hover:text-darkbg flex items-center justify-center smooth-transition text-whitepure active:scale-90"><svg class="w-6 h-6 font-bold" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>

            <div class="flex-1 overflow-y-auto custom-scrollbar pr-2 mb-6">
                <div id="catalog-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 p-1"></div>
            </div>
        </div>
    </div>

    <script>
        const MIS_MODELOS = [
            { archivo: "hormiga.gltf", titulo: "Hormiga de miel", categoria: "entidad", descripcion: "Es una hormiga muyy mielosa." },
            { archivo: "gata.gltf", titulo: "Xenny Normal", categoria: "personaje", descripcion: "La mascota oficial de XenovaTeam." },
            { archivo: "gatapower.gltf", titulo: "Xenny 100%", categoria: "personaje", descripcion: "La mascota oficial de XenovaTeam." },
            { archivo: "Karka - Madre.gltf", titulo: "Reina Karka", categoria: "entidad", descripcion: "Reina de las Karkas | serie Mythrise ft.XenovaTeam." },            
            { archivo: "Nymeria.gltf", titulo: "Nymeria", categoria: "personaje", descripcion: "Diosa del espacio | serie Mythrise ft.XenovaTeam." },
            { archivo: "Sylvara.gltf", titulo: "Sylvara", categoria: "personaje", descripcion: "Diosa de la creación | serie Mythrise ft.XenovaTeam." },
            { archivo: "Kharvex.gltf", titulo: "Kharvex", categoria: "personaje", descripcion: "Dios del Limbo | serie Mythrise ft.XenovaTeam." },
            { archivo: "perrito.gltf", titulo: "Perro Waton", categoria: "personaje", descripcion: "MODELO | Comisión USER." },
            { archivo: "Krainch.gltf", titulo: "Krainch", categoria: "entidad", descripcion: "La fackin Cabra | serie Kronia ft.XenovaTeam." },
            { archivo: "SpringBonnieDestruido.gltf", titulo: "Spring Bonnie Destruido", categoria: "personaje", descripcion: "MODELO | NgArtStudio." },
            { archivo: "Esme.gltf", titulo: "Esme Corgui Pequeña", categoria: "personaje", descripcion: "MODELO | Comisión Esmeralda." },
            { archivo: "esme_new.gltf", titulo: "Esme Corgui Grande", categoria: "personaje", descripcion: "MODELO | Comisión Esmeralda." },
            { archivo: "arpiav.gltf", titulo: "Arpia Rosa", categoria: "entidad", descripcion: "Aripia | serie Mythrise ft.XenovaTeam." },
            { archivo: "skin_vikki_slim.gltf", titulo: "Skin Vikki", categoria: "skins", descripcion: "Skin | NgArtStudio." }

        ];

        const catalogoCompleto = MIS_MODELOS.map((m, index) => ({ id: `model-${index}`, title: m.titulo, category: m.categoria, description: m.descripcion, fileUrl: m.archivo }));
        let activeModelIndex = 0, animationsList = [], currentAnimationIndex = 0, isAnimationPlaying = true;
        
        const viewer = document.getElementById('viewer'), 
              loaderOverlay = document.getElementById('loader-overlay'), 
              activeCategoryLabel = document.getElementById('active-category-label'), 
              activeDescriptionText = document.getElementById('active-description-text'), 
              viewerCurr = document.getElementById('viewer-curr'), 
              mainViewerContainer = document.getElementById('main-viewer-container'),
              catalogOverlay = document.getElementById('catalog-overlay'), 
              catalogGrid = document.getElementById('catalog-grid'), 
              searchInput = document.getElementById('catalog-search'), 
              categoryFilter = document.getElementById('catalog-category-filter');

        window.onload = () => { viewer.addEventListener('load', onModelLoaded); loadModel(0); renderCatalogGrid(); };
        
        function loadModel(index) {
            activeModelIndex = index; const model = catalogoCompleto[index]; 
            loaderOverlay.classList.remove('opacity-0', 'hidden'); 
            viewer.src = model.fileUrl; 
            viewerCurr.src = model.fileUrl;
            activeCategoryLabel.innerText = model.category; 
            activeDescriptionText.innerText = model.description; 
            
            mainViewerContainer.classList.add('carousel-fade');
            setTimeout(() => mainViewerContainer.classList.remove('carousel-fade'), 600);
        }
        
        function onModelLoaded() {
            loaderOverlay.classList.add('opacity-0'); 
            setTimeout(() => loaderOverlay.classList.add('hidden'), 500); 
            animationsList = viewer.availableAnimations || []; 
            currentAnimationIndex = 0;
            const animControls = document.getElementById('animation-controls-container'), 
                  animNameLabel = document.getElementById('current-animation-name');
            if (animationsList.length > 0) { 
                animControls.style.opacity = '1'; 
                animControls.style.pointerEvents = 'auto'; 
                viewer.animationName = animationsList[0]; 
                animNameLabel.innerText = animationsList[0]; 
                if(isAnimationPlaying) viewer.play(); 
            } else { 
                animNameLabel.innerText = "ESTÁTICO"; 
                animControls.style.opacity = '0.5'; 
                animControls.style.pointerEvents = 'none'; 
            }
        }
        
        function togglePlayAnimation() { 
            if (animationsList.length === 0) return; 
            const playPauseIcon = document.getElementById('play-pause-icon'); 
            if (isAnimationPlaying) { viewer.pause(); isAnimationPlaying = false; playPauseIcon.innerText = "▶"; } 
            else { viewer.play(); isAnimationPlaying = true; playPauseIcon.innerText = "||"; } 
        }
        
        function navigateAnimation(direction) { 
            if (animationsList.length === 0) return; 
            currentAnimationIndex = (currentAnimationIndex + direction + animationsList.length) % animationsList.length; 
            viewer.animationName = animationsList[currentAnimationIndex]; 
            document.getElementById('current-animation-name').innerText = animationsList[currentAnimationIndex]; 
            if (isAnimationPlaying) viewer.play(); 
        }
        
        function navigateCarousel(direction) { loadModel((activeModelIndex + direction + catalogoCompleto.length) % catalogoCompleto.length); }
        
        function toggleCatalog(show) { catalogOverlay.classList.toggle('hidden', !show); if (show) renderCatalogGrid(); }
        
        function renderCatalogGrid() {
            const query = searchInput.value.toLowerCase(), categoryValue = categoryFilter.value;
            const filtrados = catalogoCompleto.filter(m => (m.title.toLowerCase().includes(query) || m.description.toLowerCase().includes(query)) && (categoryValue === 'all' || m.category === categoryValue));
            catalogGrid.innerHTML = '';
            filtrados.forEach(model => {
                const realIndex = catalogoCompleto.findIndex(m => m.id === model.id);
                const card = document.createElement('button');
                card.onclick = () => { loadModel(realIndex); toggleCatalog(false); };
                card.className = `aspect-square rounded-[2rem] flex flex-col items-center justify-center p-3 smooth-transition border-[3px] border-transparent bg-darkbg hover:border-accent hover:scale-105 active:scale-95`;
                card.innerHTML = `<div class="w-full h-full flex items-center justify-center overflow-hidden"><model-viewer src="${model.fileUrl}" auto-rotate interaction-prompt="none" disable-zoom disable-pan></model-viewer></div><span class="text-xs font-black tracking-wider text-accent uppercase">${model.category}</span><h4 class="text-sm font-bold text-whitepure text-center truncate">${model.title}</h4>`;
                catalogGrid.appendChild(card);
            });
        }
        
        function filterCatalog() { renderCatalogGrid(); }
    </script>
</body>
</html>
